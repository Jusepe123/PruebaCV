version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Instalando dependencias..."
        # No hay dependencias de npm en este proyecto estático, pero mantenemos la fase
    build:
      commands:
        - echo "Construyendo aplicación estática..."
        # Para proyectos estáticos HTML/CSS/JS no se necesita build específico
  artifacts:
    baseDirectory: /
    files:
      - '**/*'
  cache:
    paths: []
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=0, must-revalidate'
        - key: 'Strict-Transport-Security'
          value: 'max-age=63072000; includeSubdomains; preload'
        - key: 'X-Content-Type-Options'
          value: 'nosniff'
        - key: 'X-Frame-Options'
          value: 'DENY'
        - key: 'X-XSS-Protection'
          value: '1; mode=block'
        - key: 'Referrer-Policy'
          value: 'strict-origin-when-cross-origin'
        - key: 'Permissions-Policy'
          value: 'camera=(), microphone=(), geolocation=()'
  buildPath: '/'